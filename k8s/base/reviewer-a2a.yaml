# The reviewer agent ("another team"), shared by the kind and ec2 overlays.
# Each overlay sets BESTIARY_MODEL (and may change OLLAMA_HOST, the public URL and the Service type).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reviewer-a2a
  labels: {app: reviewer-a2a}
spec:
  replicas: 1
  selector: {matchLabels: {app: reviewer-a2a}}
  template:
    metadata:
      labels: {app: reviewer-a2a}
    spec:
      containers:
      - name: reviewer-a2a
        image: bestiary-services:dev
        imagePullPolicy: IfNotPresent
        command: ["python", "-m", "bestiary.services.reviewer_a2a", "--host", "0.0.0.0", "--port", "9999"]
        env:
        - {name: OLLAMA_HOST, value: "http://ollama:11434"}
        - {name: BESTIARY_REVIEWER_PUBLIC_URL, value: "http://reviewer-a2a:9999/"}
        ports: [{containerPort: 9999}]
        readinessProbe:
          tcpSocket: {port: 9999}
---
apiVersion: v1
kind: Service
metadata:
  name: reviewer-a2a
spec:
  selector: {app: reviewer-a2a}
  ports: [{port: 9999, targetPort: 9999}]
