# The reviewer calls the model on the host. On Docker Desktop (macOS, Windows)
# host.docker.internal resolves to the host. On Linux, set OLLAMA_HOST to the
# docker bridge IP of the host (often http://172.17.0.1:11434) and start Ollama
# with OLLAMA_HOST=0.0.0.0.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reviewer-a2a
  labels: {app: reviewer-a2a}
spec:
  replicas: 1
  selector: {matchLabels: {app: reviewer-a2a}}
  template:
    metadata:
      labels: {app: reviewer-a2a}
    spec:
      containers:
      - name: reviewer-a2a
        image: bestiary-services:dev
        imagePullPolicy: IfNotPresent
        command: ["python", "-m", "bestiary.services.reviewer_a2a", "--host", "0.0.0.0", "--port", "9999"]
        env:
        - {name: OLLAMA_HOST, value: "http://host.docker.internal:11434"}
        - {name: BESTIARY_MODEL, value: "qwen3.5:9b"}
        - {name: BESTIARY_REVIEWER_PUBLIC_URL, value: "http://localhost:30999/"}
        ports: [{containerPort: 9999}]
---
apiVersion: v1
kind: Service
metadata:
  name: reviewer-a2a
spec:
  type: NodePort
  selector: {app: reviewer-a2a}
  ports: [{port: 9999, targetPort: 9999, nodePort: 30999}]
