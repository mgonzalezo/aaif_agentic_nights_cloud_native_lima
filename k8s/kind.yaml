# kind cluster for the Kubernetes region. Create with: uv run bestiary k8s up
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
  extraPortMappings:
  - containerPort: 30300   # agentgateway (MCP) NodePort
    hostPort: 30300
  - containerPort: 30999   # reviewer A2A NodePort
    hostPort: 30999
