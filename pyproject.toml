[project]
name = "agentic-bestiary"
version = "0.1.0"
description = "A tiny turn-based terminal game that maps the 10 AAIF projects onto one developer-assistant story."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "mcp==2.3.0",
    "a2a-sdk[http-server]==1.3.1",
    "httpx>=0.27",
    "rich>=13.7",
    "pyyaml>=6.0",
    "uvicorn>=0.30",
    "starlette>=0.37",
    "pytest>=8.0",
]

[project.optional-dependencies]
sandbox = ["opensandbox==1.2.1"]
art = ["pillow>=10.0"]

[project.scripts]
bestiary = "bestiary.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pillow>=10.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bestiary"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
